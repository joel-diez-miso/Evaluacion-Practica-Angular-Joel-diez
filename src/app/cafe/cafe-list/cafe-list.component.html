<div class="container">
  <h1 class="titulo">El aroma mágico</h1>
  <hr />
  <div class="banner"></div>
  <hr />

  <table class="table table-sm tabla-cafes">
    <thead class="table-dark">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nombre</th>
        <th scope="col">Tipo</th>
        <th scope="col">Región</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cafe of cafes">
        <th scope="row">{{ cafe.id }}</th>
        <td>{{ cafe.nombre }}</td>
        <td>{{ cafe.tipo }}</td>
        <td>{{ cafe.region }}</td>
      </tr>
    </tbody>
  </table>

  <p class="totales">Total café de origen: {{ totalOrigen }}</p>
  <p class="totales">Total café blend: {{ totalBlend }}</p>

  <footer class="contacto">
    Contact us: +57 3102105253 - info&#64;elaromamagico.com - &#64;elaromamagico
  </footer>
</div>
